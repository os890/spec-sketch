# Shared/common type definitions, referenced from SpecSketch via:
#   import Money from "common-types.yaml"
# (the path is relative to the sketch file; the generator rebases it if the yaml is
#  written somewhere else, as the Maven build does with target/generated-openapi/)
openapi: 3.0.3
info:
  title: shared common types
  version: 1.0.0
paths: {}
components:
  schemas:
    Money:
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: number
        currency:
          type: string
          minLength: 3
          maxLength: 3
