openapi: 3.0.3
info:
  title: 'createPet API (generated from SpecSketch)'
  version: 1.0.0
paths:
  '/createPet':
    post:
      operationId: postPet
      parameters:
        - name: X-Request-Id
          in: header
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              '$ref': '#/components/schemas/NewPet'
      responses:
        '200':
          description: 'Generated from SpecSketch definition ''response'''
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Pet'
components:
  schemas:
    NewPet:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        voucherCode:
          type: string
          pattern: '^[A-Z]{2}-[0-9]{4}$'
        status:
          '$ref': '#/components/schemas/PetStatus'
        category:
          '$ref': '#/components/schemas/Category'
    PetStatus:
      type: string
      enum:
        - AVAILABLE
        - PENDING
        - SOLD
    Category:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 60
        children:
          type: array
          items:
            '$ref': '#/components/schemas/Category'
    Pet:
      type: object
      required:
        - id
        - name
        - status
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 100
        status:
          '$ref': '#/components/schemas/PetStatus'
        category:
          '$ref': '#/components/schemas/Category'
        tags:
          type: array
          items:
            type: string
          maxItems: 10
        createdAt:
          type: string
          format: date-time
        birthday:
          type: string
          format: date
        owner:
          '$ref': '#/components/schemas/Owner'
    Owner:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        email:
          type: string
        pets:
          type: array
          items:
            '$ref': '#/components/schemas/Pet'
