openapi: 3.0.3
info:
  title: 'searchPets API (generated from SpecSketch)'
  version: 1.0.0
paths:
  '/searchPets':
    get:
      operationId: getPet
      parameters:
        - name: status
          in: query
          schema:
            '$ref': '#/components/schemas/PetStatus'
        - name: tag
          in: query
          schema:
            type: array
            items:
              type: string
        - name: X-Request-Id
          in: header
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            format: int32
        - name: size
          in: query
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: 'Generated from SpecSketch definition ''response'''
          content:
            'application/json':
              schema:
                type: array
                items:
                  '$ref': '#/components/schemas/Pet'
components:
  schemas:
    PetStatus:
      type: string
      enum:
        - AVAILABLE
        - PENDING
        - SOLD
    Pet:
      type: object
      required:
        - id
        - name
        - status
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 100
        status:
          '$ref': '#/components/schemas/PetStatus'
        category:
          '$ref': '#/components/schemas/Category'
        tags:
          type: array
          items:
            type: string
          maxItems: 10
        createdAt:
          type: string
          format: date-time
        birthday:
          type: string
          format: date
        owner:
          '$ref': '#/components/schemas/Owner'
    Category:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 60
        children:
          type: array
          items:
            '$ref': '#/components/schemas/Category'
    Owner:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        email:
          type: string
        pets:
          type: array
          items:
            '$ref': '#/components/schemas/Pet'
